name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Syntax and CLI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Worker and frontend syntax
        run: |
          node --check web/app.js
          node --check web/_worker.js

      - name: Compile key Python entry points
        run: |
          python -m py_compile \
            scripts/sync_to_d1.py \
            scripts/process_ingest_jobs.py \
            bp_screener/feishu.py \
            bp_screener/search.py \
            bp_screener/embeddings.py \
            bp_screener/services/rag.py \
            bp_screener/services/library_qa.py

      - name: Check CLI help
        run: |
          python scripts/sync_to_d1.py --help
          python scripts/process_ingest_jobs.py --help
